<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.workers.dev; media-src blob:; connect-src 'self' https://*.workers.dev; base-uri 'none'; form-action 'self'; object-src 'none'; upgrade-insecure-requests">
<title>Mes photos · BIGBEEZARR</title>
<meta name="description" content="Retrouvez et téléchargez vos photos BIGBEEZARR en qualité originale.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0A0A0A">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230A0A0A'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23F3F1EC' stroke-width='1.8'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='4.6' fill='none' stroke='%23E8141C' stroke-width='2' transform='rotate(-18 16 16)'/%3E%3C/svg%3E">
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="galerie.css">
<style>
/* page d'accueil « Récupérer mes photos » */
.land{padding-block:clamp(40px,8vw,110px) clamp(40px,6vw,80px)}
.kicker{font-family:var(--font-d);font-weight:700;font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-text);margin:0 0 14px}
.land h1,.g-head h1,.lock h1{margin:0;font-family:var(--font-d);font-weight:850;font-stretch:110%;font-size:clamp(2.6rem,8.4vw,7rem);line-height:.9;letter-spacing:-.024em;text-wrap:balance}
.land-p{max-width:46ch;margin:18px 0 0;color:var(--ink-2);font-size:clamp(1.02rem,1.5vw,1.2rem)}
.open-form{display:flex;gap:10px;margin-top:clamp(24px,4vw,40px);max-width:640px}
.open-form .input{min-height:56px;border-radius:999px;padding-inline:22px}
.open-form .btn{min-height:56px}
@media (max-width:560px){.open-form{flex-direction:column}}
.how{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:clamp(40px,6vw,72px) 0 0;padding:0;max-width:980px;counter-reset:s}
.how li{list-style:none;padding:18px 18px 20px 0;border-top:2px solid var(--line-2);counter-increment:s}
.how li::before{content:counter(s,decimal-leading-zero);display:block;font-family:var(--font-d);font-weight:800;color:var(--accent-text);font-size:.85rem;letter-spacing:.08em;margin-bottom:8px}
.how b{display:block;font-family:var(--font-d);font-weight:750;font-size:1.05rem;margin-bottom:4px}
.how span{color:var(--ink-3);font-size:.94rem}
@media (max-width:760px){.how{grid-template-columns:1fr;gap:0}}
.events{margin-top:clamp(48px,7vw,90px)}
.events h2{font-family:var(--font-d);font-weight:800;font-size:clamp(1.4rem,2.6vw,2rem);margin:0 0 16px;letter-spacing:-.01em}
.ev-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.ev{display:block;text-decoration:none;border-radius:var(--radius);overflow:hidden;background:var(--ground-2);border:1px solid var(--line);transition:transform .25s var(--ease-out),border-color .2s ease}
.ev figure{margin:0;aspect-ratio:4/3;background:var(--raise);overflow:hidden}
.ev img{width:100%;height:100%;object-fit:cover}
.ev div{padding:14px 16px 16px}
.ev b{display:block;font-family:var(--font-d);font-weight:750;font-size:1.08rem}
.ev small{color:var(--ink-3)}
@media (hover:hover) and (pointer:fine){.ev:hover{transform:translateY(-3px);border-color:var(--line-2)}}

/* verrou */
.lock{min-height:calc(100dvh - 61px);display:grid;align-content:center;padding-block:48px}
.lock h1{font-size:clamp(2.2rem,6.4vw,5rem)}
.lock form{display:grid;gap:14px;max-width:440px;margin-top:28px}
.lock .meta{color:var(--ink-2);margin-top:12px}

/* tête de galerie */
.g-cover{position:relative;height:min(62vh,640px);min-height:340px;overflow:hidden;background:var(--ground-2)}
.g-cover img{width:100%;height:100%;object-fit:cover;opacity:.62}
.g-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,10,10,.25) 0%,rgba(10,10,10,0) 30%,rgba(10,10,10,.55) 70%,var(--ground) 100%)}
.g-head{position:relative;z-index:1;margin-top:clamp(-260px,-22vw,-150px);padding-bottom:22px}
.g-head.nocover{margin-top:0;padding-top:clamp(36px,6vw,70px)}
.g-meta{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:14px;color:var(--ink-2);font-size:.98rem}
.g-meta span{display:inline-flex;align-items:center;gap:6px}
.g-meta .dot{width:5px;height:5px;border-radius:50%;background:var(--ink-3)}
.g-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;align-items:center}
.tools{position:sticky;top:60px;z-index:30;background:linear-gradient(180deg,var(--ground) 70%,rgba(10,10,10,0));padding-block:12px 14px}
.tools-in{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.tabs{display:inline-flex;padding:3px;border-radius:999px;border:1px solid var(--line);gap:2px}
.tabs button{height:34px;padding:0 14px;border-radius:999px;border:0;background:transparent;font-family:var(--font-d);font-weight:650;font-size:.86rem;cursor:pointer;color:var(--ink-2);white-space:nowrap}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.tools .sp{flex:1}
.empty{padding:60px 0;text-align:center;color:var(--ink-3)}
.sec-title{font-family:var(--font-d);font-weight:750;font-size:.82rem;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin:22px 0 10px}
.foot{display:flex;flex-wrap:wrap;gap:10px 24px;justify-content:space-between;padding-block:48px 28px;color:var(--ink-3);font-size:.86rem;border-top:1px solid var(--line);margin-top:56px}
.foot a{color:var(--ink-2)}
</style>
</head>
<body>
<header class="bar">
  <div class="wrap bar-in">
    <a class="logo" href="../" aria-label="BIGBEEZARR, retour au portfolio">
      <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><ellipse cx="16" cy="16" rx="4.6" ry="10" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".55"/><path d="M6 16h20" stroke="currentColor" stroke-width="1.2" opacity=".55"/><ellipse cx="16" cy="16" rx="15" ry="5" fill="none" stroke="var(--accent)" stroke-width="1.8" transform="rotate(-18 16 16)"/></svg>
      <span>BIGBEEZARR</span>
    </a>
    <span class="bar-sep" aria-hidden="true"></span>
    <a class="bar-t" href="./" data-t="nav.mine" style="text-decoration:none"></a>
    <span class="bar-sp"></span>
    <a class="chip hide-sm" href="../" data-t="nav.portfolio"></a>
    <button class="chip" id="lang" type="button"></button>
  </div>
</header>

<main id="app">
  <!-- accueil -->
  <section id="vLand" class="wrap land" hidden>
    <p class="kicker" data-t="land.kick"></p>
    <h1 data-t="land.h"></h1>
    <p class="land-p" data-t="land.p"></p>
    <form class="open-form" id="openForm" autocomplete="off">
      <label class="vh" for="openIn" data-t="land.label"></label>
      <input class="input" id="openIn" data-ph="land.ph" spellcheck="false" autocapitalize="off">
      <button class="btn primary" type="submit"><span data-t="land.go"></span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11m-4-4 4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </form>
    <p class="err" id="openErr" role="alert"></p>
    <ol class="how">
      <li><b data-t="how.1"></b><span data-t="how.1s"></span></li>
      <li><b data-t="how.2"></b><span data-t="how.2s"></span></li>
      <li><b data-t="how.3"></b><span data-t="how.3s"></span></li>
    </ol>
    <section class="events" id="events" hidden>
      <h2 data-t="ev.h"></h2>
      <div class="ev-list" id="evList"></div>
    </section>
    <p class="hint" id="notReady" hidden data-t="not.ready" style="margin-top:28px"></p>
  </section>

  <!-- verrou -->
  <section id="vLock" class="wrap lock" hidden>
    <p class="kicker" data-t="lock.kick"></p>
    <h1 id="lockTitle"></h1>
    <p class="meta" id="lockMeta"></p>
    <form id="lockForm">
      <label class="field" id="pwField" hidden><span data-t="lock.pw"></span><input class="input" type="password" id="pwIn" autocomplete="current-password"></label>
      <label class="field" id="codeField" hidden><span data-t="lock.code"></span><input class="input" id="codeIn" autocomplete="off" spellcheck="false" autocapitalize="off"></label>
      <button class="btn primary" type="submit" data-t="lock.go"></button>
      <p class="err" id="lockErr" role="alert"></p>
    </form>
  </section>

  <!-- message -->
  <section id="vMsg" class="wrap lock" hidden>
    <p class="kicker" id="msgKick"></p>
    <h1 id="msgTitle"></h1>
    <p class="land-p" id="msgText"></p>
    <div class="row" style="margin-top:26px"><a class="btn" href="./" data-t="msg.back"></a></div>
  </section>

  <!-- galerie -->
  <section id="vGal" hidden>
    <div class="g-cover" id="gCover" hidden><img alt="" id="gCoverImg"></div>
    <div class="wrap g-head" id="gHead">
      <p class="kicker" id="gKick"></p>
      <h1 id="gTitle"></h1>
      <div class="g-meta" id="gMeta"></div>
      <div class="g-actions">
        <button class="btn light" id="allBtn" type="button" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="dl.all"></span></button>
        <button class="btn" id="selBtn" type="button" hidden data-t="select"></button>
      </div>
    </div>
    <div class="tools" id="tools">
      <div class="wrap tools-in">
        <div class="tabs" id="tabs" role="group" hidden>
          <button type="button" data-view="all" aria-pressed="true" data-t="tab.all"></button>
          <button type="button" data-view="mine" hidden data-t="tab.mine"></button>
          <button type="button" data-view="picked" hidden data-t="tab.picked"></button>
        </div>
        <span class="sp"></span>
        <span class="hint" id="countHint"></span>
      </div>
    </div>
    <div class="wrap">
      <div class="grid" id="grid"></div>
      <div id="more" style="height:1px"></div>
      <p class="empty" id="emptyMsg" hidden></p>
    </div>
  </section>

  <footer class="wrap foot">
    <span>© 2026 BIGBEEZARR · Mamadou Beye</span>
    <span><a href="confidentialite.html" data-t="foot.privacy"></a> · <a href="mailto:baeypro@gmail.com">baeypro@gmail.com</a></span>
  </footer>
</main>

<!-- barre de sélection -->
<div class="selbar" id="selbar" role="region" aria-live="polite">
  <div class="n" id="selN"></div>
  <span class="sp"></span>
  <button class="btn small ghost" id="selAll" type="button" data-t="sel.all"></button>
  <button class="btn small ghost" id="selSend" type="button" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10 17 3l-4 14-3.2-5.8L3 10Z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg><span data-t="sel.send"></span></button>
  <button class="btn small primary" id="selDl" type="button"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="sel.dl"></span></button>
  <button class="icon-btn" id="selX" type="button" data-ta="sel.cancel"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
</div>

<!-- visionneuse -->
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-hidden="true">
  <div class="lb-top">
    <div class="lb-name" id="lbName"></div>
    <button class="icon-btn" id="lbSel" type="button" data-ta="lb.sel"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.4" fill="none" stroke="currentColor" stroke-width="1.6"/><path id="lbSelTick" d="m5 8.2 2 2 4-4.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0"/></svg></button>
    <button class="icon-btn" id="lbX" type="button" data-ta="lb.close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
  </div>
  <div class="lb-stage" id="lbStage">
    <img id="lbImg" alt="">
    <button class="lb-nav prev" id="lbPrev" type="button" data-ta="lb.prev"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m12 4-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button class="lb-nav next" id="lbNext" type="button" data-ta="lb.next"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m8 4 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  </div>
  <div class="lb-bot">
    <a class="btn light" id="lbDl" href="#" rel="noopener"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v10m-4-4 4 4 4-4M4 16h12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="lb.dl"></span></a>
    <span class="hint" id="lbNoDl" hidden data-t="lb.nodl"></span>
  </div>
</div>

<!-- envoi de la sélection au photographe -->
<dialog id="sendDlg" class="bottom">
  <form class="sheet stack" id="sendForm" method="dialog" style="position:relative" novalidate>
    <button class="x" type="button" data-close data-ta="lb.close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <h2 data-t="send.h"></h2>
    <p id="sendP"></p>
    <label class="field"><span data-t="send.name"></span><input id="sendName" maxlength="120" autocomplete="name"></label>
    <label class="field"><span data-t="send.email"></span><input id="sendEmail" type="email" maxlength="160" autocomplete="email" inputmode="email"></label>
    <label class="field"><span data-t="send.why"></span><select id="sendWhy"><option value="download" data-t="send.why.download"></option><option value="retouch" data-t="send.why.retouch"></option><option value="print" data-t="send.why.print"></option><option value="other" data-t="send.why.other"></option></select></label>
    <label class="field"><span data-t="send.note"></span><textarea id="sendNote" maxlength="2000" rows="3"></textarea></label>
    <p class="err" id="sendErr" role="alert"></p>
    <button class="btn primary" type="submit" data-t="send.go"></button>
  </form>
</dialog>

<!-- ZIP en plusieurs parties -->
<dialog id="zipDlg" class="bottom">
  <div class="sheet" style="position:relative">
    <button class="x" type="button" data-close data-ta="lb.close"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3l10 10M13 3 3 13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    <h2 data-t="zip.h"></h2>
    <p data-t="zip.p"></p>
    <div class="stack" id="zipParts"></div>
  </div>
</dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
