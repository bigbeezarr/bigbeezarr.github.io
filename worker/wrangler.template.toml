# Modèle de configuration du serveur des galeries. Le déploiement (GitHub Actions) le copie en wrangler.toml
# en remplaçant __D1_ID__ par l'identifiant de la base créée sur votre compte Cloudflare.
name = "bbz-galerie"
main = "src/index.js"
compatibility_date = "2025-09-15"
workers_dev = false

# Adresse publique du serveur : sous-domaine de bigbeezarr.com (la zone est sur ce compte Cloudflare ; le déploiement crée
# l'enregistrement DNS et le certificat). Le jeton d'API doit avoir « Zone > Workers Routes > Edit » sur bigbeezarr.com.
[[routes]]
pattern = "api.bigbeezarr.com"
custom_domain = true

[vars]
SITE_ORIGIN = "https://bigbeezarr.com"
# Notifications (Resend) : expéditeur sur le domaine vérifié, destinataire = l'adresse de contact du site. La clé RESEND_API_KEY reste un secret.
NOTIFY_FROM = "BIGBEEZARR <reservations@bigbeezarr.com>"
NOTIFY_EMAIL = "baeypro@gmail.com"
# Éditeur du portfolio : fichiers content/*.json de ce dépôt, sur la branche du pipeline (le jeton est un secret à part).
GITHUB_REPO = "bigbeezarr/bigbeezarr.github.io"
GITHUB_BRANCH = "source"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "bbz-galerie"

[[d1_databases]]
binding = "DB"
database_name = "bbz-galerie"
database_id = "__D1_ID__"

# Nettoyage quotidien : galeries expirées, imports abandonnés.
[triggers]
crons = ["17 8 * * *"]

[observability]
enabled = true
