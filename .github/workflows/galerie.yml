# Déploie le serveur des galeries (Cloudflare Workers + R2 + D1) et relie les pages /galerie/ et /admin/.
# Secrets à créer dans GitHub (Settings > Secrets and variables > Actions) : voir worker/README.md.
name: Déployer la galerie client

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/galerie.yml"]
  # Demande de fusion : seuls les tests tournent, rien n'est déployé.
  pull_request:
    paths: ["worker/**", ".github/workflows/galerie.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: galerie-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

jobs:
  # Tests du serveur, sans aucun secret : imitations locales de GitHub, Resend et Turnstile (voir worker/test/run-all.sh).
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Tests
        working-directory: worker
        run: |
          pip install --disable-pip-version-check Pillow==12.3.0
          bash test/run-all.sh

  deploy:
    needs: tests   # aucune mise en ligne si un seul test échoue
    # Seule la branche main déploie : ni une demande de fusion, ni un lancement manuel depuis une autre branche.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write   # relancer « Publier le portfolio » après avoir relié le formulaire de réservation
    # Les secrets ne sont donnés qu'aux étapes qui en ont besoin (jamais à l'installation des paquets).
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v6

      - name: Vérifier les secrets
        id: check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BBZ_ADMIN_PASSWORD: ${{ secrets.BBZ_ADMIN_PASSWORD }}
        run: |
          missing=""
          [ -z "$CLOUDFLARE_API_TOKEN" ] && missing="$missing CLOUDFLARE_API_TOKEN"
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && missing="$missing CLOUDFLARE_ACCOUNT_ID"
          [ ${#BBZ_ADMIN_PASSWORD} -lt 10 ] && missing="$missing BBZ_ADMIN_PASSWORD(10+ caractères)"
          if [ -z "$missing" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "ready=false" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then echo "::error::Secrets manquants :$missing. Voir worker/README.md."; exit 1; fi
          echo "::notice::Galerie client pas encore configurée (secrets manquants :$missing). Déploiement ignoré."

      - uses: actions/setup-node@v6
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Installer
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        run: npm install --no-audit --no-fund

      - name: Stockage R2 et base D1
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler r2 bucket create bbz-galerie > r2.log 2>&1 || grep -qiE "already exists|already own|10004" r2.log || { cat r2.log; exit 1; }
          d1id() { npx wrangler d1 list --json 2>/dev/null | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const a=JSON.parse(s.slice(s.indexOf("["),s.lastIndexOf("]")+1));const d=a.find(x=>x.name==="bbz-galerie");process.stdout.write(d?(d.uuid||d.id||""):"")}catch{}})'; }
          ID=$(d1id)
          if [ -z "$ID" ]; then npx wrangler d1 create bbz-galerie; ID=$(d1id); fi
          [ -n "$ID" ] || { echo "::error::Impossible de créer ou trouver la base D1 bbz-galerie"; exit 1; }
          sed "s/__D1_ID__/$ID/" wrangler.template.toml > wrangler.toml
          npx wrangler d1 execute bbz-galerie --remote --file=schema.sql

      - name: Déployer le Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler deploy 2>&1 | tee deploy.log
          # Adresse publique : le domaine personnalisé de wrangler.template.toml (api.bigbeezarr.com), sinon l'adresse workers.dev.
          HOST=$(sed -n 's/^pattern *= *"\([^"/*]*\)".*/\1/p' wrangler.template.toml | head -1)
          URL=${HOST:+https://$HOST}
          [ -n "$URL" ] || URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "::error::Adresse du serveur introuvable (ni domaine personnalisé, ni workers.dev)."; exit 1; }
          echo "API_URL=$URL" >> "$GITHUB_ENV"

      - name: Secrets du Worker
        if: steps.check.outputs.ready == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BBZ_ADMIN_PASSWORD: ${{ secrets.BBZ_ADMIN_PASSWORD }}
          BBZ_CONTENT_TOKEN: ${{ secrets.BBZ_CONTENT_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          TURNSTILE_SECRET: ${{ secrets.TURNSTILE_SECRET }}
        run: |
          printf '%s' "$BBZ_ADMIN_PASSWORD" | npx wrangler secret put ADMIN_PASSWORD
          if ! npx wrangler secret list 2>/dev/null | grep -q SIGNING_KEY; then
            openssl rand -base64 48 | tr -d '\n' | npx wrangler secret put SIGNING_KEY
          fi
          # Services facultatifs : chacun n'est relié que si son secret existe dans GitHub. Le secret GitHub du jeton de contenu
          # s'appelle BBZ_CONTENT_TOKEN (GitHub interdit les noms commençant par GITHUB_) ; le serveur le lit sous GITHUB_TOKEN.
          put() { if [ -n "$2" ]; then printf '%s' "$2" | npx wrangler secret put "$1" >/dev/null && echo "relié : $1"; else echo "absent : $1"; fi; }
          put GITHUB_TOKEN "$BBZ_CONTENT_TOKEN"
          put RESEND_API_KEY "$RESEND_API_KEY"
          put TURNSTILE_SECRET "$TURNSTILE_SECRET"

      - name: Vérifier le serveur
        if: steps.check.outputs.ready == 'true'
        run: |
          # Un nouveau domaine personnalisé attend son certificat quelques minutes : jusqu'à 5 minutes d'essais.
          for i in $(seq 1 30); do
            if curl -fsS "$API_URL/api/health" > health.json 2>/dev/null && grep -q '"ok":true' health.json; then cat health.json; echo; break; fi
            sleep 10
          done
          grep -q '"ok":true' health.json || { echo "::error::Le serveur ne répond pas sur $API_URL/api/health"; exit 1; }

      - name: Relier les pages au serveur
        if: steps.check.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf '// Adresse du serveur des galeries. Écrite automatiquement par le déploiement (voir worker/README.md).\nwindow.BBZ_API = "%s";\n' "$API_URL" > galerie/config.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add galerie/config.js
          if ! git diff --cached --quiet; then git commit -m "Relie la galerie client au serveur $API_URL" && git push; fi
          # Formulaire de réservation de l'accueil : « api » de content/site.json (branche source) prend l'adresse du serveur,
          # puis le portfolio est republié (un envoi fait avec le jeton du workflow ne relance pas les autres workflows).
          git fetch -q --depth=1 origin source
          git worktree add -q ../src FETCH_HEAD
          cd ../src
          python3 - "$API_URL" <<'PY'
          import json, re, sys
          p = "content/site.json"; s = open(p, encoding="utf-8").read()
          if json.loads(s).get("api") != sys.argv[1]:
              s = re.sub(r'"api": *"[^"]*"', '"api": ' + json.dumps(sys.argv[1]), s, count=1)
              assert json.loads(s)["api"] == sys.argv[1]
              open(p, "w", encoding="utf-8").write(s)
          PY
          git add content/site.json
          if ! git diff --cached --quiet; then
            git commit -m "Relie le formulaire de réservation au serveur $API_URL"
            git push origin HEAD:source
            gh workflow run publier.yml --ref source
          fi
